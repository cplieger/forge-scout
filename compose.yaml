# Example compose for forge-scout. See the README for all configuration options and hardening.
services:
  forge-scout:
    image: ghcr.io/cplieger/forge-scout:latest
    container_name: forge-scout
    restart: unless-stopped
    # Must own the ./data host folder. If .env sets PUID and PGID, those numbers are used.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # forge-scout's data. Run "mkdir -p data && sudo chown 1000:1000 data" before the first start.
      # If .env sets PUID and PGID, use those numbers.
      - "./data:/data"
