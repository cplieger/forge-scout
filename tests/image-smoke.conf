# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs scheduled mode on a committed config whose
# one connection points at a host that does not resolve. Health is loop
# liveness, so the failing first scan leaves the container healthy, which
# proves the binary, the config mount, the health file and the health
# subcommand. The root filesystem is read-only with no tmpfs, as in
# docs/hardening.md, so the gate proves the health file lives in /dev/shm and
# the run state on the /data volume. The harness also waits for the first
# scan complete line, which follows the state save, and smoke_verify reads
# /data/state.json to prove /data is writable by the nonroot user.
SMOKE_APP_NAME=forge-scout
SMOKE_TIMEOUT=120
# --read-only leaves the image's /data read-only. A new named volume starts as a
# copy of that directory, nonroot owner included, where a host bind mount would not.
SMOKE_DATA_VOLUME="smoke-forge-scout-data-$$"
SMOKE_RUN_ARGS="--read-only -v $SMOKE_DATA_VOLUME:/data -v $SMOKE_DIR/smoke-config:/config:ro -e FORGE_SCOUT_SMOKE_TOKEN=smoke-dummy-token"
SMOKE_LOG_PATTERN='"msg":"scan complete"'

# shellcheck disable=SC2329  # called by the harness EXIT trap after the container is removed
smoke_cleanup() {
  docker volume rm -f "$SMOKE_DATA_VOLUME" >/dev/null 2>&1 || true
}

SMOKE_LICENSE_TREE=1

# shellcheck disable=SC2329  # called by the harness once the container is healthy
smoke_verify() {
  state_dir=$(mktemp -d)
  if ! docker cp "$SMOKE_CONTAINER:/data/state.json" "$state_dir/state.json" >/dev/null; then
    rm -rf "$state_dir"
    printf 'FAIL: forge-scout saved no /data/state.json after its first scan\n' >&2
    return 1
  fi
  if ! grep -q '"version":' "$state_dir/state.json"; then
    rm -rf "$state_dir"
    printf 'FAIL: forge-scout /data/state.json is not a run state file\n' >&2
    return 1
  fi
  rm -rf "$state_dir"
  printf 'forge-scout run state saved to /data/state.json\n'
}
