# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Starts the daemon with an empty data volume on a
# read-only root; smoke_verify copies /data/forge-scout.db out to prove the
# store opened and /data is writable.
SMOKE_APP_NAME=forge-scout
SMOKE_TIMEOUT=120
# --read-only leaves the image's /data read-only. A new named volume starts as a
# copy of that directory, nonroot owner included, where a host bind mount would not.
SMOKE_DATA_VOLUME="smoke-forge-scout-data-$$"
SMOKE_RUN_ARGS="--read-only -v $SMOKE_DATA_VOLUME:/data"
SMOKE_LOG_PATTERN='"msg":"forge-scout started"'

# shellcheck disable=SC2329  # called by the harness EXIT trap after the container is removed
smoke_cleanup() {
  docker volume rm -f "$SMOKE_DATA_VOLUME" >/dev/null 2>&1 || true
}

SMOKE_LICENSE_TREE=1

# shellcheck disable=SC2329  # called by the harness once the container is healthy
smoke_verify() {
  data_dir=$(mktemp -d)
  if ! docker cp "$SMOKE_CONTAINER:/data/forge-scout.db" "$data_dir/forge-scout.db" >/dev/null; then
    rm -rf "$data_dir"
    printf 'FAIL: forge-scout wrote no /data/forge-scout.db\n' >&2
    return 1
  fi
  rm -rf "$data_dir"
  printf 'forge-scout data file written to /data/forge-scout.db\n'
}
