# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Starts the daemon with an empty data volume on a
# read-only root and both ports published on loopback; smoke_verify proves
# /data is written and asks each port from the host, since the distroless
# image has no shell or curl.
SMOKE_APP_NAME=forge-scout
SMOKE_TIMEOUT=120
# --read-only leaves the image's /data read-only. A new named volume starts as a
# copy of that directory, nonroot owner included, where a host bind mount would not.
SMOKE_DATA_VOLUME="smoke-forge-scout-data-$$"
SMOKE_RUN_ARGS="--read-only -v $SMOKE_DATA_VOLUME:/data -p 127.0.0.1::7466 -p 127.0.0.1::7467"
SMOKE_LOG_PATTERN='"msg":"forge-scout started"'

# shellcheck disable=SC2329  # called by the harness EXIT trap after the container is removed
smoke_cleanup() {
  docker volume rm -f "$SMOKE_DATA_VOLUME" >/dev/null 2>&1 || true
}

SMOKE_LICENSE_TREE=1

# smoke_addr PORT: the container port's published loopback address.
smoke_addr() {
  out=$(docker port "$SMOKE_CONTAINER" "$1/tcp") || return 1
  printf '%s\n' "$out" | head -n 1
}

# smoke_get HOST PORT PATH: the body of GET PATH on the port's published
# address, then its status code on a line of its own. The request arrives from the Docker bridge, not
# loopback, so the Host header decides whether forge-scout admits it.
smoke_get() {
  addr=$(smoke_addr "$2") || return 1
  curl -sS --max-time 10 -H "Host: $1" -w '\n%{http_code}' "http://$addr$3"
}

# smoke_expect HOST PORT PATH STATUS PATTERN: fails unless GET PATH answers
# STATUS with a body holding PATTERN.
smoke_expect() {
  if ! out=$(smoke_get "$1" "$2" "$3"); then
    printf 'FAIL: GET %s on port %s did not answer\n' "$3" "$2" >&2
    return 1
  fi
  status=$(printf '%s\n' "$out" | tail -n 1)
  if [ "$status" != "$4" ] || ! printf '%s\n' "$out" | grep -q -- "$5"; then
    printf 'FAIL: GET %s on port %s with Host %s answered %s, want %s with %s\n' "$3" "$2" "$1" "$status" "$4" "$5" >&2
    return 1
  fi
}

# shellcheck disable=SC2329  # called by the harness once the container is healthy
smoke_verify() {
  data_dir=$(mktemp -d)
  if ! docker cp "$SMOKE_CONTAINER:/data/forge-scout.db" "$data_dir/forge-scout.db" >/dev/null; then
    rm -rf "$data_dir"
    printf 'FAIL: forge-scout wrote no /data/forge-scout.db\n' >&2
    return 1
  fi
  rm -rf "$data_dir"
  smoke_expect localhost 7467 /healthz 200 '"ok"' || return 1
  smoke_expect localhost 7467 /metrics 200 '^forge_scout_build_info{' || return 1
  smoke_expect localhost 7466 / 404 '"not_found"' || return 1
  smoke_expect evil.example 7466 / 403 '"host_not_allowed"' || return 1
  printf 'forge-scout payload: /data/forge-scout.db written, /healthz and /metrics on 7467, not_found on 7466, Host evil.example refused 403\n'
}
